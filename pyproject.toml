[project]
name = "llm-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wsc9150", email = "wsc9150@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "faiss-cpu>=1.15.0",
    "fonttools>=4.65.0",
    "grandalf>=0.8",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.2",
    "langfuse>=4.15.4",
    "load-dotenv>=0.1.0",
    "openai>=3.11.0",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.5",
    "playsound==1.2.2",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "streamlit>=1.64.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
llm-workspace = "llm_workspace:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
